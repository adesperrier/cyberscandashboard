<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberScan Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav class="navbar-custom">
        <div class="container-fluid">
            <span class="navbar-brand">CyberScan Dashboard</span>
            <span class="badge bg-primary-neon">v1.0.0</span>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="sidebar">
            <div class="card-modern">
                <h5 class="card-title">Network Scan</h5>
                <form id="scanForm">
                    <div class="mb-3">
                        <label class="form-label">Target</label>
                        <input type="text" class="form-control" id="target" placeholder="192.168.1.1 or 10.0.0.0/24" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mode</label>
                        <select class="form-select" id="mode">
                            <option value="quick">Quick (Top 100)</option>
                            <option value="common">Common Ports</option>
                            <option value="full">Full Scan (All 65535)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Custom Ports (optional)</label>
                        <input type="text" class="form-control" id="customPorts" placeholder="80,443,8080">
                    </div>

                    <button type="submit" class="btn btn-primary-neon w-100">Scan</button>
                </form>
            </div>

            <div class="card-modern mt-4">
                <h5 class="card-title">Statistics</h5>
                <div class="stat-item">
                    <span>Open Ports:</span>
                    <strong id="openPorts">0</strong>
                </div>
                <div class="stat-item">
                    <span>Services:</span>
                    <strong id="servicesCount">0</strong>
                </div>
                <div class="stat-item">
                    <span>Critical Issues:</span>
                    <strong id="criticalCount" class="text-danger-neon">0</strong>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div id="resultsSection" style="display: none;">
                <div class="card-modern">
                    <h5 class="card-title">Scan Results</h5>
                    <div class="table-responsive">
                        <table class="table-modern" id="resultsTable">
                            <thead>
                                <tr>
                                    <th onclick="sortResults('host')">Host <span class="sort-indicator"></span></th>
                                    <th onclick="sortResults('port')">Port <span class="sort-indicator"></span></th>
                                    <th onclick="sortResults('state')">State <span class="sort-indicator"></span></th>
                                    <th onclick="sortResults('service')">Service <span class="sort-indicator"></span></th>
                                    <th onclick="sortResults('product')">Product <span class="sort-indicator"></span></th>
                                    <th onclick="sortResults('risk')">Risk <span class="sort-indicator"></span></th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody id="resultsBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="historySection" class="mt-4">
                <div class="card-modern">
                    <h5 class="card-title">Scan History</h5>
                    <div id="historyList"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-dark">
            <div class="modal-content modal-dark">
                <div class="modal-header">
                    <h5 class="modal-title">Port Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
